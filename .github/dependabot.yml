---
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "17:00"
      timezone: "America/Chicago"
    cooldown:
      default-days: 7

  - package-ecosystem: "gomod"
    directory: "/"
    groups:
      go-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "17:00"

      timezone: "America/Chicago"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directory: "/"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "stylelint*"
      stylelint-packages:
        patterns:
          - "stylelint*"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "17:00"
      timezone: "America/Chicago"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "17:00"
      timezone: "America/Chicago"
    cooldown:
      default-days: 7

  - package-ecosystem: "pre-commit"
    directory: "/"
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "17:00"
      timezone: "America/Chicago"
    cooldown:
      default-days: 7
